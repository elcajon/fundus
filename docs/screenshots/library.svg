            <rect x="30" y="30" width="8" height="8"/><rect x="44" y="44" width="8" height="8"/><rect x="30" y="52" width="8" height="8"/>
          </g>
        </g>
        <text x="0" y="368" font-size="12.5" fill="#1d1d1f">2026-09-12_Hardware Store_Receipt 42.90 €</text>
        <text x="0" y="386" font-size="11.5" fill="#86868b">12 Sept</text>
        <g transform="translate(0,398)">
