          <rect x="94" width="48" height="18" rx="5" fill="#fde2e1"/><text x="103" y="13" font-size="11" fill="#9b2c25">Taxes</text>
        </g>
      </g>

      <!-- Dokument 3 -->
      <g transform="translate(736,124)">
        <g filter="url(#cardShadow)"><rect width="260" height="340" rx="4" fill="#fff"/></g>
        <circle cx="216" cy="46" r="16" fill="#eef1f8"/>
        <path d="M208 46h16M216 38v16" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
