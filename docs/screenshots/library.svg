        <rect x="150" y="264" width="86" height="9" rx="3" fill="#48484a"/>
        <rect x="150" y="282" width="86" height="7" rx="3" fill="#c7c7cc"/>
        <text x="0" y="368" font-size="12.5" fill="#1d1d1f">2026-09-14_City Utilities_Annual bill</text>
        <text x="0" y="386" font-size="11.5" fill="#86868b">14 Sept</text>
        <g transform="translate(0,398)">
