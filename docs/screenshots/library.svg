          <rect x="24" y="28" width="120" height="9" rx="3" fill="#48484a"/>
          <g fill="#c7c7cc"><rect x="24" y="52" width="196" height="6" rx="3"/><rect x="24" y="68" width="150" height="6" rx="3"/><rect x="24" y="84" width="186" height="6" rx="3"/></g>
        </g>
        <g transform="translate(736,560)"><g filter="url(#cardShadow)"><rect width="260" height="210" rx="4" fill="#fff"/></g>
          <rect x="24" y="28" width="134" height="9" rx="3" fill="#48484a"/>
          <g fill="#c7c7cc"><rect x="24" y="52" width="196" height="6" rx="3"/><rect x="24" y="68" width="176" height="6" rx="3"/><rect x="24" y="84" width="140" height="6" rx="3"/></g>
