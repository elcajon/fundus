          <rect x="120" width="60" height="18" rx="5" fill="#d9f0e2"/><text x="129" y="13" font-size="11" fill="#1c6b47">Home</text>
        </g>
      </g>

      <!-- Dokument 2 (Kassenbon, schmal) -->
      <g transform="translate(416,124)">
        <g filter="url(#cardShadow)"><rect x="60" width="140" height="340" rx="4" fill="#fff"/></g>
        <g fill="#c7c7cc">
          <rect x="84" y="28" width="92" height="8" rx="3" fill="#48484a"/>
          <rect x="84" y="48" width="70" height="5" rx="2"/><rect x="84" y="60" width="86" height="5" rx="2"/>
          <rect x="84" y="88" width="92" height="5" rx="2"/><rect x="84" y="100" width="76" height="5" rx="2"/>
          <rect x="84" y="112" width="92" height="5" rx="2"/><rect x="84" y="124" width="64" height="5" rx="2"/>
        </g>
        <rect x="84" y="148" width="92" height="1" fill="#e5e5ea"/>
        <rect x="84" y="160" width="60" height="9" rx="3" fill="#48484a"/>
        <g fill="#1d1d1f" opacity="0.85" transform="translate(96,196)">
