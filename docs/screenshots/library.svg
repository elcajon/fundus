        <g transform="translate(0,398)">
          <rect width="94" height="18" rx="5" fill="#e6e4e0"/><text x="9" y="13" font-size="11" fill="#3a3a3c">Sample Bank</text>
          <rect x="102" width="48" height="18" rx="5" fill="#fde2e1"/><text x="111" y="13" font-size="11" fill="#9b2c25">Taxes</text>
