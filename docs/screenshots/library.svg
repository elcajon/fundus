<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3f46"/><stop offset="1" stop-color="#22242a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6f4"/><stop offset="1" stop-color="#eceae7"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win"><rect x="40" y="30" width="1200" height="740" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="800" fill="url(#wall)"/>
  <g filter="url(#winShadow)"><rect x="40" y="30" width="1200" height="740" rx="14" fill="#ffffff"/></g>

  <g clip-path="url(#win)">
    <rect x="40" y="30" width="1200" height="64" fill="url(#chrome)"/>
    <circle cx="70" cy="62" r="6" fill="#ff5f57"/><circle cx="90" cy="62" r="6" fill="#febc2e"/><circle cx="110" cy="62" r="6" fill="#28c840"/>
    <text x="140" y="57" font-size="14" font-weight="600" fill="#1d1d1f">Fundus</text>
    <text x="140" y="75" font-size="12" fill="#86868b">248 documents</text>

    <!-- Werkzeugleiste -->
    <g fill="#48484a">
      <g transform="translate(846,50)">
        <rect width="32" height="28" rx="8" fill="#e6e4e0"/>
        <path d="M16 9v10M11 14h10" stroke="#3a3a3c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </g>
      <g transform="translate(884,50)">
        <rect width="32" height="28" rx="8" fill="#e6e4e0"/>
        <path d="M16 8v11M11.5 12.5 16 8l4.5 4.5M10 19v2h12v-2" stroke="#3a3a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <g transform="translate(922,50)">
        <rect width="32" height="28" rx="8" fill="#e6e4e0"/>
        <circle cx="16" cy="14" r="7" stroke="#3a3a3c" stroke-width="1.8" fill="none"/>
        <path d="M16 11v6M16 9.4v.6" stroke="#3a3a3c" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
    <rect x="970" y="48" width="242" height="32" rx="16" fill="#e6e4e0"/>
    <circle cx="990" cy="64" r="5.5" stroke="#86868b" stroke-width="1.6" fill="none"/>
    <path d="M994 68l4 4" stroke="#86868b" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1004" y="69" font-size="12.5" fill="#86868b">Search, #tag, @sender, typ:type</text>

    <!-- Raster -->
    <g>
      <!-- Dokument 1 -->
      <g transform="translate(96,124)">
        <g filter="url(#cardShadow)"><rect width="260" height="340" rx="4" fill="#fff"/></g>
        <rect x="24" y="24" width="96" height="10" rx="3" fill="#1d4ed8"/>
        <rect x="24" y="44" width="58" height="6" rx="3" fill="#c7c7cc"/>
        <rect x="24" y="86" width="150" height="7" rx="3" fill="#48484a"/>
        <rect x="24" y="102" width="120" height="6" rx="3" fill="#c7c7cc"/>
        <rect x="24" y="116" width="134" height="6" rx="3" fill="#c7c7cc"/>
        <rect x="24" y="152" width="212" height="1" fill="#e5e5ea"/>
        <g fill="#c7c7cc">
          <rect x="24" y="168" width="212" height="6" rx="3"/><rect x="24" y="184" width="196" height="6" rx="3"/>
          <rect x="24" y="200" width="204" height="6" rx="3"/><rect x="24" y="216" width="150" height="6" rx="3"/>
